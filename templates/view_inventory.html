<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Inventory - NTL Resource Portal</title>
    <!-- Tailwind CSS CDN for styling matching the project's dark theme -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
        
        <!-- Header Section with Title and Navigation -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-red-500">Inventory Status</h1>
            <div class="flex gap-3">
                <a href="/admin/inventory/edit" class="text-sm bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg transition">Edit Inventory</a>
                <a href="/admin" class="text-sm bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg transition">Back to Dashboard</a>
            </div>
        </div>

        <!-- Inventory Items Display List -->
        <div class="space-y-4">
            {% for item in inventory %}
            <div class="flex items-center justify-between bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                <!-- Item Name -->
                <span class="font-medium text-slate-200">{{ item.name }}</span>
                
                <!-- Availability Status Badge -->
                <div>
                    {% if item.quantity > 0 %}
                        <span class="bg-emerald-900 text-emerald-200 text-xs px-3 py-1 rounded-full font-semibold">Available ({{ item.quantity }})</span>
                    {% else %}
                        <span class="bg-rose-900 text-rose-200 text-xs px-3 py-1 rounded-full font-semibold">Out of Stock</span>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
        
    </div>
</body>
<!-- Footerrrr -->
<footer class="mt-12 pt-6 border-t border-slate-800 text-xs text-slate-500 flex justify-between items-center">
    <span>NTL Resource Management Portal — Internal Use Only</span>
    <span>Built by <span class="text-slate-400 font-medium">Nicole Wangeci</span> — Cloud Intern 2026</span>
</footer>
</html>
